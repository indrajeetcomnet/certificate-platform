# Server Configuration
server.port=8080

# Default profile (dev: H2 in Postgres mode; postgres: external PostgreSQL/Supabase)
spring.profiles.active=dev

# PostgreSQL Configuration (used when SPRING_PROFILES_ACTIVE=postgres or DB_HOST is set)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:certificate_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# SQL Init
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=true

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false

# Multipart File Upload (up to 20MB photos)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

